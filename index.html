<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>OpenFlix</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="scripts/main.css">
        <script src="scripts/main.js"></script>
    </head>
    <body>
        <header>
            <nav>
                <a href="">
                    <img src="assets/branding/header-logo.png">
                </a>
            </nav>
            <center-tab>
                <button><i class="bi bi-search"></i></button>
            </center-tab>
        </header>
        <section id="popular" fill="movies/today/popular" filter="movies" name="Trending movies"></section>
        <section id="popular" fill="movies/today/popular" filter="tv" name="Trending series"></section>
        <section id="popular" fill="//movies/alltime/popular" type="tv" name="All time popular shows"></section>
        <section id="popular" fill="//movies/genre" type="movies" name="Movies you might like"></section>
        <section id="popular" fill="//movies/genre" type="tv" name="Shows you might like"></section>
        

    </body>
</html>
