<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>OpenFlix</title>
        <link rel="icon" href="assets/branding/favicon.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="scripts/main.css">
        <link rel="stylesheet" href="scripts/ui/sys.css">
        <link rel="stylesheet" href="scripts/ui/loader.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
        <script src="scripts/ui/sys.js"></script>
        <script src="scripts/openflix/incidents.js"></script>
        <script src="scripts/main.js"></script>
    </head>
    <body>
        <header>
            <nav>
                <a href="">
                    <img src="assets/branding/header-logo.png">
                </a>
            </nav>
            <center-tab>
                <input searchin>
                <button search><i searchicon class="bi bi-search"></i></button>
                <tabs>
                    <tab tab="home">home</tab>
                    <tab tab="trending">trending</tab>
                    <tab tab="watchlist">watchlist</tab>
                </tabs>
            </center-tab>
            <right>
            <a link="account/">
                <button account><i class="bi bi-person-circle"></i></button>
                <windowmove></windowmove>
            </a>
            </right>
        </header>

        <splash>
            <flex>
                <img src="assets/branding/header-logo.png">
                <loader></loader>
            </flex>
            <prog loader="val">
                <val></val>
            </prog>
            <p>loading</p>
        </splash>

        <newshi>
            <scroll>
                
            </scroll>
            <pos>
            </pos>
            <infobar>
                <h1 info="title"></h1>
                <subinfo>
                    <p><i class="bi bi-star-fill"></i> <span info="rating"></span></p>
                    <p info="year"></p>
                    <genres></genres>
                </subinfo>
                <control-bar>
                    <button watch>Watch<i class="bi bi-chevron-right"></i></button>
                    <button parents>Parents guide<i class="bi bi-chevron-right"></i></button>
                </control-bar>
            </infobar>
        </newshi>
        <scroller>
            <section id="popular" fill="movies/today/popular" filter="movies" name="Trending movies" home trending></section>
        </scroller>
        <scroller>
            <section id="popular" fill="movies/today/popular" filter="tv" name="Trending series" home trending></section>
        </scroller>
        <scroller>
           <section id="popular" fill="//movies/alltime/popular" type="tv" name="All time popular shows" home></section>
        </scroller>
        <scroller>
            <section id="popular" fill="//movies/genre" type="movies" name="Movies you might like" home></section>
        </scroller>
        <scroller>
            <section id="popular" fill="//movies/genre" type="tv" name="Shows you might like" home ></section>
        </scroller>
    </body>
</html>
