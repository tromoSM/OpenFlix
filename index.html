<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>OpenFlix</title>
        <link rel="icon" href="assets/branding/favicon.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="scripts/main.css">
        <link rel="stylesheet" href="scripts/layout.css">
        <link rel="stylesheet" href="scripts/ui/sys.css">
        <link rel="stylesheet" href="scripts/ui/loader.css">
        <script src="https://accounts.google.com/gsi/client" async></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
        <script src="https://unpkg.com/colorthief@3/dist/umd/color-thief.global.js"></script>
        <script src="scripts/ui/sys.js"></script>
        <script src="scripts/openflix/incidents.js"></script>
        <script src="scripts/sync.js"></script>
        <script src="scripts/signup.js"></script>
        <script src="scripts/profile.js"></script>
        <script src="scripts/main.js"></script>
        <script src="scripts/watchmanager.js"></script>
        <script src="platform_specific/python/socket.io.min.js"></script> 
        <script src="scripts/wrappermanager.js"></script>
        <script src="scripts/wrapper_menu.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' http://localhost:* localhost:* 127.0.0.1:* * openflix.site  demo-openflix.vercel.app openflix.gt.tc cloudflare.com jsdelivr.net 'unsafe-inline';">
        <meta name="google-adsense-account" content="ca-pub-7037029257776504">
    </head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RECVVKGCWN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-RECVVKGCWN');
    </script>

    <body>
        <header>
            <nav>
                <a href="">
                    <img src="assets/branding/header-logo.png">
                </a>
              <navigation wrapperonly>
                <button nav="prev"><i class="bi bi-chevron-left"></i></button>
                <button nav="next"><i class="bi bi-chevron-right"></i></button>
                <button nav="reload"><i class="bi bi-arrow-clockwise"></i></button>
              </navigation>
            </nav>
            <center-tab>
                <input searchin>
                <button search><i searchicon class="bi bi-search"></i></button>
                <tabs>
                    <tab tab="home">home</tab>
                    <tab tab="trending">trending</tab>
                    <tab tab="watchlist">watchlist</tab>
                </tabs>
            </center-tab>
            <right>
            <button sign>Sign in</button>
            <a link="account/">
                <button account><i class="bi bi-person-circle"></i></button>
                <windowmove></windowmove>
            </a>
            </right>
        </header>
        <splash>
            <flex>
                <img src="assets/branding/header-logo.png">
                <loader></loader>
            </flex>
            <prog loader="val">
                <val></val>
            </prog>
            <p>loading</p>
            <wrappercontrols wrapperonly>
                <button wrapc="clearsources">clear sources</button>
                <button wrapc="openlog">open log</button>
            </wrappercontrols>
        </splash>
        <wrappersource wrapperonly setup hiddenA hiddenB>
            <i class="bi bi-person-fill-gear"></i>
            <h1>Finish setup</h1>
            <p bio>Finish setup or continue to import custom sources.</p>
            <flex>
                <button mainchoice>Finish setup</button>
                <button>import sources <i class="bi bi-chevron-right"></i></button>
            </flex>
        </wrappersource>
        <wrappersource hiddenA wrapperonly hiddenB source>
            <button back="setup"></button>
            <i class="bi bi-globe2"></i>
            <wrtabs>
                <wrtab tab="choose" selected>choose source from library</wrtab>
                <wrtab tab="source" >enter source url</wrtab>
            </wrtabs>
            <wropt tab="choose" selected>
                <h2>Choose a source from below</h2>
                <library></library>
            </wropt>
            <wropt tab="source">
                <h2>Enter a source link</h2>
                <inwrapper>
                    <input placeholder="ex : https://example.com/source/">
                    <button submit><i class="bi bi-chevron-right"></i></button>
                </inwrapper>
            </wropt>
        </wrappersource>
        <newshi>
            <clickshi></clickshi>
            <scroll>
                
            </scroll>
            <pos>
            </pos>
            <infobar>
                <h1 info="title">
                    <span><!--hiddenB--></span>
                    <!-- <svg aria-hidden="true"  head hiddenB>
                      <clipPath id="newshiblurmask">
                      <text dominant-baseline="hanging" text-anchor="start" x="0" y="0em" dy="0.125em">Text</text>
                      </clipPath>
                   </svg> -->
                </h1>
                <subinfo>
                    <p><i class="bi bi-star-fill"></i> <span info="rating"></span></p>
                    <p info="year"></p>
                    <genres></genres>
                </subinfo>
                <control-bar>
                    <button watch>Watch<i class="bi bi-chevron-right"></i></button>
                    <button parents>Parents guide<i class="bi bi-chevron-right"></i></button>
                </control-bar>
            </infobar>
        </newshi>
        <scroller>
            <section id="popular" fill="movies/today/popular" filter="movies" name="Trending movies" home trending></section>
        </scroller>
        <scroller>
            <section id="popularTV" fill="movies/today/popular" filter="tv" name="Trending series" home trending></section>
        </scroller>
        <scroller>
           <section id="alltime" fill="//movies/alltime/popular" type="tv" name="All time popular shows" home></section>
        </scroller>
        <scroller>
            <section id="alltimeTV" fill="//movies/genre" type="movies" name="Movies you might like" home></section>
        </scroller>
        <scroller>
            <section id="recommended" fill="//movies/genre" type="tv" name="Shows you might like" home ></section>
        </scroller>
        
        <staticsection sect="watchlist" hiddenA hiddenB>
            <h2 sectitle>Watchlist</h2>
            <tablex table="watchlist">
                <titem>
                    SpiderMan Brand new day 
                    <alignr>
                    <button><i class="bi bi-play-fill"></i></button>
                    <button><i class="bi bi-trash3-fill"></i></button>
                    </alignr>
                </titem>
            </tablex>
        </staticsection>
    </body>
</html>
